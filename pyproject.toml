[project]
name = "splitwise-lite"
version = "0.1.0"
description = "Splitwise Lite: a group records shared expenses and sees who owes whom."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["refs", "tmp", "_tools", "_design", "_docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/**/routes.py" = ["B008"]
"app/**/api.py" = ["B008"]
"app/core/session.py" = ["B008"]
"app/main.py" = ["B008"]
"app/core/db.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
